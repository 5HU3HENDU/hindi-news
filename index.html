<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>हिन्दी न्यूज़</title>
<meta name="description" content="Latest videos from 5 Hindi news channels, newest first — swipe like a reel.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://5hu3hendu.github.io/hindi-news/">
<meta property="og:title" content="हिन्दी न्यूज़">
<meta property="og:description" content="Newest videos from 5 Hindi news channels — swipe like a reel.">
<meta property="og:image" content="https://5hu3hendu.github.io/hindi-news/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="हिन्दी न्यूज़">
<meta name="twitter:description" content="Newest videos from 5 Hindi news channels — swipe like a reel.">
<meta name="twitter:image" content="https://5hu3hendu.github.io/hindi-news/og-image.png">
<meta name="theme-color" content="#0f0f0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="हिन्दी न्यूज़">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
<header>
  <div class="topbar">
    <h1>हिन्दी न्यूज़</h1>
    <div class="top-actions">
      <button id="refreshBtn" title="Refresh" aria-label="Refresh">↻</button>
      <button id="listBtn" title="All videos" aria-label="All videos">☰</button>
    </div>
  </div>
</header>

<main id="reel" aria-label="Videos, newest first"></main>

<div id="backdrop"><img id="backdropImg" alt=""></div>

<div id="stage">
  <div id="stageCard">
    <div id="playerBox">
      <div id="player"></div>
      <div id="taplayer" title="Tap to play / pause"></div>
    </div>
    <div id="headline">
      <div id="ovTitle">Loading…</div>
      <div id="ovMeta"></div>
    </div>
  </div>
</div>

<div id="controls">
  <button id="prevBtn">← Prev</button>
  <div class="mid">
    <button id="muteBtn" aria-label="Mute / unmute">🔇</button>
  </div>
  <button id="nextBtn">Next →</button>
</div>

<div id="startOverlay">
  <div class="start-inner">
    <h1>हिन्दी न्यूज़</h1>
    <p>5 channels • newest first</p>
    <button id="startBtn">▶&nbsp; Start</button>
  </div>
</div>

<div id="listview" hidden>
  <div class="lv-head">
    <h2>All videos</h2>
    <button id="listClose" aria-label="Close">✕</button>
  </div>
  <div id="lvMeta"></div>
  <div id="lvRows"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="app.js?v=6"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
