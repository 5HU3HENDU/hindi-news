<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>हिन्दी न्यूज़</title>
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
<header>
  <div class="topbar">
    <h1>हिन्दी न्यूज़</h1>
    <div class="top-actions">
      <button id="refreshBtn" title="Refresh" aria-label="Refresh">↻</button>
      <button id="listBtn" title="All videos" aria-label="All videos">☰</button>
    </div>
  </div>
</header>

<main id="reel" aria-label="Videos, newest first"></main>

<div id="backdrop"><img id="backdropImg" alt=""></div>

<div id="stage">
  <div id="stageCard">
    <div id="playerBox">
      <div id="player"></div>
      <div id="taplayer" title="Tap to play / pause"></div>
    </div>
    <div id="headline">
      <div id="ovTitle">Loading…</div>
      <div id="ovMeta"></div>
    </div>
  </div>
</div>

<div id="controls">
  <button id="prevBtn">← Prev</button>
  <div class="mid">
    <button id="muteBtn" aria-label="Mute / unmute">🔇</button>
  </div>
  <button id="nextBtn">Next →</button>
</div>

<div id="startOverlay">
  <div class="start-inner">
    <h1>हिन्दी न्यूज़</h1>
    <p>5 channels • newest first</p>
    <button id="startBtn">▶&nbsp; Start</button>
  </div>
</div>

<div id="listview" hidden>
  <div class="lv-head">
    <h2>All videos</h2>
    <button id="listClose" aria-label="Close">✕</button>
  </div>
  <div id="lvMeta"></div>
  <div id="lvRows"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="app.js?v=4"></script>
</body>
</html>
